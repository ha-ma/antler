# 依存の脆弱性と更新を週 1 回確かめる（/sfad init Phase 11）。
# npm は workspaces でルートの package-lock.json にまとまるので、ルート 1 か所で apps/* と packages/* を覆う。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        dependency-type: development
    # ESLint 10 と TypeScript 7 のメジャー更新は、プラグイン（eslint-plugin-import など）の対応がそろうまで除外する
    # （2026-11-03 ユーザー判断。#5 は npm ci の ERESOLVE で失敗した）。マイナー・パッチの更新は今までどおり受ける
    ignore:
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: pip
    directory: /edge/detector
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
