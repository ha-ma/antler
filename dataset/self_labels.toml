# self_labels.toml — 自分で撮った映像の、鹿の箱の台帳（docs/specs/dataset-train R12）。
# 対象は dataset/private/self-footage/（dataset-footage が匿名化した後の JPEG のフレーム）。匿名化の前の映像は使わない。
# 座標は匿名化した後のフレーム（1920×1080）の画素で [x1, y1, x2, y2]（左上と右下）。
# track = 1 頭の 1 区間。キーの間はフレーム番号で線形補間する（キーの外には伸ばさない）。
# mark: empty = 鹿が見えないと確かめた（鹿なしとして使う）、ignore = そのフレームを使わない（track より優先）。
# 鹿ありの区間（manifest の deer = true）のフレームは、どれかの track か mark に必ず当たること（train_l0.py が止める）。
# ぼかしの箱（manifest の blur_boxes）と重なる箱があるフレームは、train_l0.py が機械的に使わない（blurred）。
# 画像・切り抜きは Git に入れない。確かめに使った重ね描きは作業用のフォルダにだけ置いた。

[meta]
labeler = "Claude（claude-opus-5-5、antler の dataset-train の session）"
method = """匿名化した後のフレームを、明るさを上げて（ガンマ 0.45）1.5〜2 倍に拡大し、50 画素の格子を重ねて目で座標を読んだ。
キーは鹿ありのサンプル（0.218 秒おき）の 2 枚おき（約 0.44 秒）。間は線形補間。補間した全フレームを重ね描きで見て、ずれたものはキーを足して直した。
今の L0（yolo26n-deer-20261105）は夜に 0 検出、COCO に鹿のクラスは無いので、モデルの候補は使っていない。確かめたのは 1 人（Claude）だけ。専門家の正解ではない。"""
date = "2026-11-07"
negatives_checked = """train に入る鹿なしのフレーム（negative_every で間引いた後）と、val の朝の走行の全フレームを、明るさを上げた縮小の一覧（1 枚 384 画素幅）で見た。
縮小なので、夜の遠い鹿・暗い鹿は見落としうる（道ばたの映像の鹿は拡大しても判断できなかった）。"""

