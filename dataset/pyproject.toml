# dataset/ の道具の設定だけ（パッケージにはしない）。依存は edge/detector の dev: pip install -e "edge/detector[dev]"
# スクリプトは detector から JudgeRequest・build_request・トラッカーの定数を import して、edge と同じ組み立てを使う。

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=export_l1_labels --cov=train_l0 --cov-report=term-missing --cov-fail-under=70"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# edge/detector と同じ規則（print 禁止・広い except 禁止・Any 禁止・秘密の直書き・未使用）
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "T20", "BLE", "ANN", "S", "PTH"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["detector", "export_l1_labels", "train_l0"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]
