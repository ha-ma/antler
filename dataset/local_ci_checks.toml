# local_ci_checks.toml — 匿名データセットと学習スクリプトの検査の一覧。
# 中身はまだ無い。学習スクリプトの /sfad cycle でテストができたら required = false と ci = false を消す。
# （--ci では見送りが fail になるので、テストが無いあいだは CI で回さない）

[stack]
name = "dataset"

[[check]]
name = "pytest"
cmd = ["{PYTHON}", "-m", "pytest", "-q"]
needs_path = "tests"
required = false
ci = false
hint = "dataset/tests を作る（学習スクリプトの cycle）"
