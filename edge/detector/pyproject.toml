# B: Mac Mini の検知パイプライン（jev）。要件は docs/requirements/ch4-edge.md・ch6-nfr.md。
# 推論（YOLOv8 CoreML）・カメラ・WebSocket の依存は edge-detector の /sfad cycle で足す。
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "antler-detector"
version = "0.0.0"
description = "EZO ROAD B: 車載カメラの鹿検知とスマホ通知"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pydantic>=2.7", "websockets>=14"]

[project.optional-dependencies]
camera = ["opencv-python>=4.9"]
coreml = ["ultralytics>=8.2", "coremltools>=7.2"]
# 実行（edge-run: python -m detector）に要るものだけ。CoreML の読み込み（coremltools）、推論の入力の
# 変換（Pillow）、カメラと JPEG（opencv）。ultralytics（torch を引く）は書き出しにだけ使うので入れない。
# coremltools の版は day0 と同じ（macOS arm64・Python 3.11〜3.13 の wheel を 2026-11-04 に確認）
run = ["coremltools==9.0", "Pillow>=10", "opencv-python>=4.9"]
# L1（edge-l1）: local-jev（github.com/amithgc/local-jev @ 64a0b31、MIT）を呼ぶ公式 SDK（MIT）。
# local-jev 自体は別プロセスのサーバーなので依存に入れない（Mac mini で別に入れる。torch と重みを引く）。
# 無くても L0 は動く（起動時に l1_unavailable: sdk_missing）。
l1 = ["typesafe-sdk==0.7.5"]
# Day 0（Mac mini の実機作業。docs/runbooks/2026-11-04-mac-mini-day0.md）: YOLO-World の CoreML 書き出しと計測。
# 重い（torch を引く）ので dev に入れない。CI では入れない。版は 2026-11-04 に PyPI の実在と
# macOS arm64・Python 3.11〜3.13 の wheel を確かめた。ultralytics 8.4.202 の CoreML 書き出しは
# coremltools>=9.0、numpy<=2.3.5、Python<=3.13 を要る。mlx は L1 の local-jev では使われない（指示書の依存）。
day0 = [
  "ultralytics==8.4.202",
  "coremltools==9.0",
  "mlx==0.32.4",
  "numpy>=1.26,<=2.3.5",
]
# datamodel-code-generator は JSON Schema から pydantic を作る（scripts/generate_models.py）。出力が変わらないよう版を固定する。
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "jsonschema>=4.18",
  "datamodel-code-generator==0.88.0",
  "typesafe-sdk==0.7.5",  # L1 のクライアントを実物の SDK（httpx2.MockTransport）で確かめる
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=detector --cov-report=term-missing --cov-fail-under=70"

[tool.ruff]
line-length = 100
target-version = "py311"
# JSON Schema から生成したファイル。手で直さないので整形・lint の対象外（鮮度は tests/test_judge_request_model.py）
extend-exclude = ["src/detector/schema/judge_request.py"]

[tool.ruff.lint]
# /sfad init の lint 要件: print 禁止（T20）、何でも捕まえる except 禁止（BLE・E722）、
# Any の禁止（ANN401）、秘密情報の直書き（S105〜S107）、未使用（F）。
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "T20", "BLE", "ANN", "S", "PTH"]
# 日本語の文書・コメントの全角括弧などを「紛らわしい文字」として扱わない
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]
# 設定ページの 4 言語の文（1 文を 1 行に置き、言語どうしを見比べやすくする。pwa-https）
"src/detector/pwa_server.py" = ["E501"]
