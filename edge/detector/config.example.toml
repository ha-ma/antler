# edge/detector の設定の見本（既定値）。読み込みは detector.config.load_config。
# 書かなかったキーは既定値になる。知らないセクション・キーはエラー。

[camera]
source = "device"     # device | file
device = 0
path = ""             # source = "file" のときの動画
width = 1280
height = 720
fps = 60

[pipeline]
target_fps = 10       # 5〜10 に間引く（B2-1）

[infer]
model_path = ""       # YOLO の CoreML（.mlpackage）。空なら CoreML の検出器は作れない
budget_ms = 100

[coreml]
compute_units = "cpu_and_ne"   # L0 は CPU と Neural Engine（B1-3）。cpu_only | cpu_and_gpu | cpu_and_ne | all

[judge]
threshold = 0.8       # 赤（2 フレーム連続）の確信度の下限。0.4〜0.8 は赤にしない（B2-3）
off_after_s = 1.5
stall_after_s = 3.0
distance_table = [[0.03, 55.0], [0.05, 33.0], [0.10, 16.0], [0.20, 8.0], [0.40, 4.0]]

[tracker]
min_conf = 0.4        # トラッカーに入れる確信度の下限（判定の閾値とは別）
iou_threshold = 0.3
max_age_s = 1.0
window_s = 1.0
hfov_deg = 70.0       # 暫定。実車の画角で測り直す
lane_half_width_m = 1.75

# L0 の誤検出の後処理（docs/specs/l0-fp-filter）。トラッカーと即時ルール（0.8・2 フレーム）の手前で、
# 鹿の枠を除く・弱める。鹿の赤を落とさないことを優先した既定値（本物の鹿ならカメラから 2 m より近い枠だけに
# 当たる。水平画角 70° の暫定値での見積もり）。直前 1 秒に通した枠から続く枠（近づいた鹿・止まった車の前の鹿）は
# 除かない。下限は 2 m 以遠の鹿を除かない値。
[l0_filter]
enabled = true
max_area = 0.7                 # 0.65〜1。面積（w×h、画面に対する比）がこれ以上の枠を除く（画面全体のぶれ・風景）
max_width = 0.85               # 0.7〜1。幅がこれ以上で、
min_height_at_max_width = 0.5  # 0.4〜1。高さもこれ以上の枠を除く（遠くの横長の群れは残す）
# 無視する領域 [x1, y1, x2, y2]（正規化、左上と右下）。車載カメラの取り付けで決まるので既定は空。
# 実車でボンネット・ミラー・ガラスの機器が写る位置を測ってから、車ごとの設定に書く。
# 各領域は画面の辺に接し、車線の見張りの帯（x 0.25〜0.75・y 0.3〜0.8）と交わらず、面積 0.25 以下。
# 面積の和 0.4 以下、8 個まで。例:
#   ignore_regions = [[0.0, 0.88, 1.0, 1.0], [0.92, 0.32, 1.0, 0.46]]   # ボンネット、右端のガラスの機器
ignore_regions = []
region_min_inside = 0.8        # 0.8〜1。枠の面積のうち 1 つの領域に入る割合がこれ以上なら
region_conf_scale = 0.5        # 0〜0.95。確信度にこれを掛ける（0.9 → 0.45: 赤にならず追跡は続く）。0 なら除く

[server]
host = "127.0.0.1"    # 車載では AP の LAN のアドレス
port = 8765
max_clients = 16

# L1: Mac mini 上の local-jev（github.com/amithgc/local-jev @ 64a0b31、別に入れて動かす）に 4 問を聞く。
#   local-jev serve --model llm-qwen2.5-1.5b --port 8766
# 降格（赤 → 赤でない）にだけ使う。赤は L0 が鳴らす。L1 が止まっても L0 だけで動く（edge-l1）。
# 接続先は環境変数 TYPESAFE_BASE_URL があればそちらが優先。ループバック以外には送らない。
[l1]
enabled = true
base_url = "http://127.0.0.1:8766"   # local-jev の既定 8765 は WebSocket（[server] port）とぶつかるので 8766
model = "jev-latest"                 # local-jev が既定のモデル（llm-qwen2.5-1.5b）に割り当てる
rate_hz = 2.5                        # 2〜3
timeout_ms = 800                     # 50〜800。リトライしない
override_conf = 0.9                  # 校正後 conf がこれ以上のときだけ降格（0.9〜1。B2-5）
l2_route_conf = [0.5, 0.9]           # この範囲は L2 の候補としてログ（L2 は未実装）
wait_for_l1_before_red = false       # B2-8。true でも保留は 150 ms まで
calibration_path = "calibration.json"  # 無ければ降格しない。相対パスはこのファイルのディレクトリから
# PWA が返す車の状態（速度・ゾーンの内外・光）。pwa = 届いた実値を使う。ただし calibration.json が
# "context": "real"（実値で学習した）と宣言しているか、校正なしのときだけ。固定値で学習した校正のあいだは固定値
vehicle_state = "pwa"                # pwa | fixed（fixed は常に 60 km/h・inside・night・low）
vehicle_max_age_s = 10.0             # 1〜60。ゾーンと光の期限。速度は 3 秒

[l2]
enabled = "auto"      # auto | off。L2 は未実装（Step 5）

# 検知フレームの保存（B2-5、docs/specs/edge-capture）。赤の経路の外（別スレッド）で保存する。
# 車内を写すカメラの経路は持たない（フロントガラスの外を向いた 1 台の映像だけ）。
[capture]
enabled = true
dir = "captures"          # 相対パスはこのファイルのディレクトリから。git に入れない
image_width = 320         # 160〜640（B3-3）。高さは 4:3
jpeg_quality = 80         # 50〜95
trigger_conf = 0.8        # この確信度以上の検出があるフレームを保存（0.4〜1。tracker.min_conf 以上）
min_interval_s = 2.0      # 保存の最短の間隔（フレームの t_frame で測る）
max_per_run = 300         # 1 回の起動で保存する枚数の上限
max_items = 2000          # ディスクの上限（超えたら送信済みの古いものから消す）
queue_size = 8            # 溢れたら捨てて数える（赤の経路を待たせない）
l1_attach_window_s = 3.0  # l1Probs（校正前の確率）を付ける、L1 の答えの前後の秒数
retention_hours = 24      # 1〜168。この時間でどれも消す（送信済みも）。「提供しない」はすぐ消える

# 走行後に PWA が Capture を取りに来る HTTP（一覧・画像・同意・送信済み）。
[capture_server]
host = "127.0.0.1"        # 車載では AP の LAN のアドレス
port = 8767               # WebSocket（8765）・local-jev（8766）とぶつけない
allowed_origins = []      # PWA のオリジン（例: ["http://ezoroad.local:5174"]）。空ならブラウザの別オリジンから書けない
