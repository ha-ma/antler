# local_ci_checks.toml — B の車載検知（Python）の検査の一覧。
# 案件のルートの local_ci_checks.toml から取り込まれる。cwd・needs_path はこのフォルダからの相対。
# 道具は edge/detector の dev 依存: pip install -e "edge/detector[dev]"

[stack]
name = "edge"

[[check]]
name = "ruff"
cwd = "detector"
cmd = ["{PYTHON}", "-m", "ruff", "check", "."]
needs_probe = ["{PYTHON}", "-m", "ruff", "--version"]
hint = "pip install -e \"edge/detector[dev]\""

[[check]]
name = "ruff format"
cwd = "detector"
cmd = ["{PYTHON}", "-m", "ruff", "format", "--check", "."]
needs_probe = ["{PYTHON}", "-m", "ruff", "--version"]
hint = "python -m ruff format edge/detector"

[[check]]
name = "pytest"
cwd = "detector"
cmd = ["{PYTHON}", "-m", "pytest", "-q"]
needs_probe = ["{PYTHON}", "-m", "pytest", "--version"]
hint = "pip install -e \"edge/detector[dev]\""
