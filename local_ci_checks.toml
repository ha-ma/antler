# local_ci_checks.toml — antler の検査の一覧（手元の scripts/local-ci.py と CI が同じこの一覧を読む）。
# stack ごとの一覧は各フォルダにあり、ここから取り込む。packages / edge / dataset の一覧はまだ中身が無いので
# required = false。その feature の /sfad cycle でテストができたら必須に戻す。

[local_ci]
base = "origin/main"
include = [
  "apps/sim/local_ci_checks.toml",
  "apps/pwa/local_ci_checks.toml",
  "apps/api/local_ci_checks.toml",
  "packages/local_ci_checks.toml",
  "edge/local_ci_checks.toml",
  "dataset/local_ci_checks.toml",
]

[[check]]
name = "stack registry"
stack = "common"
cmd = ["{PYTHON}", "scripts/registry_check.py"]
hint = "routes.toml に stack と規則を足す"

[[check]]
name = "architecture"
stack = "common"
cmd = ["{PYTHON}", "scripts/ci_arch_check.py", "--base", "{BASE_SHA}"]
hint = "python scripts/ci_arch_check.py --self-test で検査自体を確かめる"

[[check]]
name = "antler hooks"
stack = "common"
cmd = ["{PYTHON}", "scripts/tests/test_antler_hooks.py"]
hint = ".claude/hooks/dispatch_local_rules.py か ch9-status.py を直す"

# SFAD: 仕様とコードの乖離（STALE / THREAT GAP / COVERAGE GAP など）。/sfad init Phase 11.5
[[check]]
name = "sfad drift"
stack = "common"
cmd = ["{PYTHON}", ".claude/hooks/sfad-drift.py"]
hint = "/sfad drift で中身を確かめ、仕様かコードを直す"

# A のバンドルの上限（docs/specs/performance/functional.md R6）。apps/sim を一時フォルダへ本番ビルドし、
# 画面ごとの最初の JS と 3D のチャンクの gzip を上限と比べる
[[check]]
name = "sim bundle budget"
stack = "sim"
cmd = ["node", "scripts/perf/bundle-budget.mjs"]
needs_path = "node_modules"
hint = "遅延読込にするか、理由を functional.md R6 に書いて scripts/perf/bundle-budget.mjs の上限を上げる"
timeout = 600

# バンドルの上限のスクリプトの自己テスト（ビルドしない。共有のチャンク・遅延読込の口の扱い）
[[check]]
name = "sim bundle budget self-test"
stack = "sim"
cmd = ["node", "--test", "scripts/perf/bundle-budget.test.mjs"]
hint = "scripts/perf/bundle-budget.mjs の resolveKey・closure・unknownDynamicEntries を直す"
