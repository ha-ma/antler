# local_ci_checks.toml — 共有パッケージ（alert-ui / schema / zones）の検査の一覧。
# 案件のルートの local_ci_checks.toml から取り込まれる。cwd・needs_path はこのフォルダからの相対。
# 依存は npm workspaces でルートの node_modules に集まる。

[stack]
name = "packages"

[[check]]
name = "tsc"
cmd = ["npx", "--no-install", "tsc", "--noEmit", "-p", "tsconfig.json"]
needs = "npx"
needs_path = "../node_modules"
hint = "npm ci（案件のルートで）"

[[check]]
name = "eslint"
cmd = ["npx", "--no-install", "eslint", "."]
needs = "npx"
needs_path = "../node_modules"
hint = "npm ci（案件のルートで）"

[[check]]
name = "vitest"
cmd = ["npx", "--no-install", "vitest", "run"]
needs = "npx"
needs_path = "../node_modules"
hint = "npm ci（案件のルートで）"
timeout = 1800
